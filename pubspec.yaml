name: otel_provider
description: >-
  OpenTelemetry instrumentation for `package:provider`. A `ChangeNotifier`
  mixin emitting short spans on every notifyListeners and dispose - works
  with any ChangeNotifier.
version: 0.2.0-wip
repository: https://github.com/dartastic/otel_provider
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  flutter:
    sdk: flutter

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
